<section my-columns="75%">
    <h2>Plumbing the pretty-printers</h2>
    <div style="width:100%;">
        <pre class="python fragment"><code data-line-reveal="1|3-8|9|10|11|12|13|9-14|15,18|16+17|17|1-18"><script type="text/template">
            import gdb.printing

            class MyTypePrinter:
                def __init__(self, val):
                    pass
                def to_string(self):
                    return "Hello, printer!"

            def build_pretty_printer():
                pp = gdb.printing.RegexpCollectionPrettyPrinter("my_printers")
                pp.add_printer("MyType", "^MyType$", MyTypePrinter)
                pp.add_printer("MyTemplateType", "^MyTemplateType<.*>$", MyTypePrinter)
                return pp

            gdb.printing.register_pretty_printer(
                gdb.current_objfile(),
                build_pretty_printer()
            )
        </script></code></pre>
    </div>
</section>
