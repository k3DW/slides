<section data-markdown class="list-fade-in-then-semi-out">
    <textarea data-template>
        ## GDB auto-loading
        * Automatic execution of GDB script or Python extension
        * For example, libstdc++'s auto-loading script
        * Based on the name of your binary, e.g. "libstdc++.so"
    </textarea>
</section>

<section my-columns="85%">
    <h2>libstdc++ auto-loading</h2>
    <div style="width:100%;">
        <pre class="bash fragment"><code data-line-reveal="1|2"><script type="text/template">
            $ g++ -print-file-name=libstdc++.so
            /usr/lib/gcc/x86_64-linux-gnu/11/libstdc++.so
        </script></code></pre>
        <pre class="bash fragment"><code data-line-reveal="1|2-3"><script type="text/template">
            $ ls /usr/share/gdb/auto-load/usr/lib/gcc/x86_64-linux-gnu/11/
            ls: cannot access '/usr/share/gdb/auto-load/usr/lib/gcc/x86_64-linux-gnu/11/':
              No such file or directory
        </script></code></pre>
        <div class="fragment emoji-format">
            🤔
        </div>
    </div>
</section>

<section my-columns>
    <h2>libstdc++ auto-loading</h2>
    <div style="width:100%;">
        <pre class="bash"><code data-line-reveal="1|2"><script type="text/template">
            $ readlink -f $(g++ -print-file-name=libstdc++.so)
            /usr/lib/x86_64-linux-gnu/libstdc++.so.6.0.30
        </script></code></pre>
        <pre class="bash fragment"><code data-line-reveal="1|2"><script type="text/template">
            $ ls /usr/share/gdb/auto-load/usr/lib/x86_64-linux-gnu/
            libstdc++.so.6.0.30-gdb.py
        </script></code></pre>
        <span class="fragment">In general: <code>{auto_load_dir}/{full_binary_path}-gdb.py</code></span>
        <br/>
        <pre class="python fragment"><code data-line-reveal="1-2|3|4|5|6|1-6"><script type="text/template">
            # Summary of the auto-loading script:

            import os.path
            # ... do things to os.path ...
            from libstdcxx.v6 import register_libstdcxx_printers
            register_libstdcxx_printers(gdb.current_objfile())
        </script></code></pre>
    </div>
</section>

<section my-columns>
    <h2>libstdc++ auto-loading</h2>
    <div style="width:100%;">
        <pre class="bash"><code data-line-numbers=""><script type="text/template">
            $ ls /usr/share/gdb/auto-load/usr/lib/x86_64-linux-gnu/
            libstdc++.so.6.0.30-gdb.py
        </script></code></pre>
        <pre class="bash fragment"><code data-line-numbers=""><script type="text/template">
            $ ls /usr/share/gcc/python/libstdcxx/v6/
            __init__.py  printers.py  xmethods.py
        </script></code></pre>
    </div>
</section>

<section my-columns>
    <h2>libstdc++ auto-loading</h2>
    <div style="width:100%;">
        <pre class="cpp fragment"><code data-ln-start-from data-line-numbers=""><script type="text/template">
            #include <string>
            #include <vector>
            int main() {
                std::vector<std::string> vec;
                vec.push_back("abcdefghijklmnopqrstuvwxyz");
                vec.push_back("zyxwvutsrqponmlkjihgfedcba");
            }
        </script></code></pre>
        <pre class="bash fragment"><code data-line-numbers=""><script type="text/template">
            $ g++ main.cpp -g
        </script></code></pre>
    </div>
</section>

<section my-columns="95%">
    <h2>libstdc++ auto-loading</h2>
    <div style="width:100%;">
        <pre class="text"><code data-line-reveal="1-2|3-4|5|5-11|12-14|15-17|18-20"><script type="text/template">
            (gdb) file a.out
            Reading symbols from a.out...
            (gdb) break 7
            Breakpoint 1 at 0x2533: file main.cpp, line 7.
            (gdb) run
            Starting program: /path/to/a.out
            [Thread debugging using libthread_db enabled]
            Using host libthread_db library "path/to/libthread_db.so.1".

            Breakpoint 1, main () at main.cpp:7
            7                   }
            (gdb) print vec
            $1 = std::vector of length 2, capacity 2 = {
              "abcdefghijklmnopqrstuvwxyz", "zyxwvutsrqponmlkjihgfedcba"}
            (gdb) info auto-load python-scripts
            Loaded  Script
            Yes     /usr/share/gdb/auto-load/usr/lib/x86_64-linux-gnu/libstdc++.so.6.0.30-gdb.py
            (gdb) show auto-load safe-path
            List of directories from which it is safe to auto-load files is
              $debugdir:$datadir/auto-load.
        </script></code></pre>
    </div>
</section>

<section my-columns="90%">
    <h2>GDB auto-loading</h2>
    <div style="width:100%;">
        <pre class="text fragment"><code data-line-reveal="1|1-3"><script type="text/template">
            $ gdb -batch -ex "show auto-load safe-path"
            List of directories from which it is safe to auto-load files is
              $debugdir:$datadir/auto-load
        </script></code></pre>
        <pre class="text fragment"><code data-line-reveal="1|1-2|3|3-4"><script type="text/template">
            $ gdb -batch -ex "show debug-file-directory"
            The directory where separate debug symbols are searched for is "/usr/lib/debug".
            $ gdb -batch -ex "show data-directory"
            GDB's data directory is "/usr/share/gdb".
        </script></code></pre>
        <pre class="text fragment"><code data-line-reveal="1|2|3"><script type="text/template">
            $debugdir:$datadir/auto-load
            =>
            /usr/lib/debug:/usr/share/gdb/auto-load
        </script></code></pre>
        <span class="fragment">Our scripts should go in <code>/usr/share/gdb/auto-load</code></span>
    </div>
</section>
