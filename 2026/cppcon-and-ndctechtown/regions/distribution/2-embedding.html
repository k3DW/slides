<section data-markdown class="list-fade-in-then-semi-out">
    <textarea data-template>
        ## Embed pretty-printer in source code
        * I first saw Niall Douglas, Boost.Outcome in 2024
        * Inline assembly block containing the Python code
        * Add printer to special ".debug_gdb_scripts" section
    </textarea>
</section>

<section my-columns>
    <h2>Embed pretty-printer in source code</h2>
    <div style="width:100%;">
        <pre class="cpp fragment"><code data-line-reveal="1-9|10-11,17|12|13-15|16|10-17"><script type="text/template">
            struct Line {
                int left;
                int right;
            };

            int main() {
                Line line{ 100, 600 };
            }

            __asm__(
                ".pushsection \".debug_gdb_scripts\", \"MS\",%progbits,1\n"
                ".ascii \"\\4gdb.inlined-script.LinePrinter\\n\"\n"

                // ... Python code ...

                ".byte 0\n"
                ".popsection\n");
        </script></code></pre>
    </div>
</section>

<section my-columns="100%">
    <!-- <h2>Embed pretty-printer in source code</h2> -->
    <div style="width:100%;">
        <pre class="cpp"><code data-line-reveal="1-6,22-24|7-21" style="font-size:96%;"><script type="text/template">
            // ...

            __asm__(
                ".pushsection \".debug_gdb_scripts\", \"MS\",%progbits,1\n"
                ".ascii \"\\4gdb.inlined-script.LinePrinter\\n\"\n"

                ".ascii \"class LinePrinter:\\n\"\n"
                ".ascii \"    def __init__(self, val):\\n\"\n"
                ".ascii \"        pass\\n\"\n"
                ".ascii \"    def to_string(self):\\n\"\n"
                ".ascii \"        return \\\"Hello, printer!\\\"\\n\"\n"

                ".ascii \"def build_pretty_printer():\\n\"\n"
                ".ascii \"    pp = gdb.printing.RegexpCollectionPrettyPrinter(\\\"my_printers\\\")\\n\"\n"
                ".ascii \"    pp.add_printer(\\\"Line\\\", \\\"^Line$\\\", LinePrinter)\\n\"\n"
                ".ascii \"    return pp\\n\"\n"

                ".ascii \"gdb.printing.register_pretty_printer(\\n\"\n"
                ".ascii \"    gdb.current_objfile(),\\n\"\n"
                ".ascii \"    build_pretty_printer()\\n\"\n"
                ".ascii \")\\n\"\n"

                ".byte 0\n"
                ".popsection\n");
        </script></code></pre>
    </div>
</section>

        * Must only allow auto-loading for your binary
        * Collaboration, script to make this asm from Python
