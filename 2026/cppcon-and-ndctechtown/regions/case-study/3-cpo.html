    <textarea data-template>
        ## User-injected behaviour
        * Sometimes the hashmap use fancy pointers
        * E.g. `boost::interprocess::offset_ptr`
        * You may have your own allocator with its own fancy pointer
    </textarea>
</section>

            // boost/interprocess/offset_ptr.hpp
            // namespace boost::interprocess
            template <...>
            class offset_ptr
            {
               ipcdetail::offset_ptr_internal<OffsetType, OffsetAlignment> internal;

            public:
               BOOST_INTERPROCESS_FORCEINLINE pointer get() const BOOST_NOEXCEPT
               {  return static_cast<pointer>(
                   ipcdetail::offset_ptr_to_raw_pointer(this, this->internal.m_offset));   }

               BOOST_INTERPROCESS_FORCEINLINE reference operator*() const BOOST_NOEXCEPT
               {
                  pointer p = this->get();
                  reference r = *p;
                  return r;
               }
            };

<section data-markdown class="list-fade-in-then-semi-out">
    <textarea data-template>
        ## Fancy pointers
        * `operator*()` can be arbitrary code
        * "Fancy pointer types" is an open set
        * How do I support every possible fancy pointer?
        * Either don't support them in the pretty-printers...
        * ...or allow user-injected behaviour
    </textarea>
</section>

<section data-markdown class="list-fade-in-then-semi-out">
    <textarea data-template>
        ## User-injected behaviour
        * In Python create a "customization point" object
        * If the pointer type has a pretty-printer, use it
        * Otherwise fallback
    </textarea>
</section>

<section my-columns="80%">
    <h2>Customization points</h2>
    <div style="width:100%;">
        <pre class="python fragment"><code
            data-line-reveal="1|2-3|4-6|7-8|9"
        ><script type="text/template">
            class BoostUnorderedPointerCustomizationPoint:
                def __init__(self, any_ptr):
                    vis = gdb.default_visualizer(any_ptr)
                    if vis is None:
                        self.to_address = lambda ptr: ptr
                        self.next = lambda ptr, offset: ptr + offset
                    else:
                        self.to_address = lambda ptr: type(vis).boost_to_address(ptr)
                        self.next = lambda ptr, offset: type(vis).boost_next(ptr, offset)
        </script></code></pre>
    </div>
</section>

<section data-markdown class="list-fade-in-then-semi-out">
    <textarea data-template>
        ## User-injected behaviour
        * The user can add functionality to their pretty-printer
        * Then we can hook into it
        * Necessary to be fully generic
    </textarea>
</section>

                self.cpo = BoostUnorderedPointerCustomizationPoint(self.table["arrays"]["groups_"])
                self.groups = self.cpo.to_address(self.table["arrays"]["groups_"])
                self.elements = self.cpo.to_address(self.table["arrays"]["elements_"])
