<section my-columns>
    <h2><code>k3::gdb</code> with CTest</h2>
    <div style="width:100%;">
        <pre class="cpp fragment"><code data-line-numbers="3-7|8-11|"><script type="text/template">
            #include <k3/gdb/test_main.hpp>

            TEST("test 1") {
                using namespace k3::gdb::checks;
                assert_prints(1, "2");
                expect_prints(3, "3");
            }
            TEST("test 2") {
                k3::gdb::assert_prints(8, "8");
                k3::gdb::expect_prints(9, "9");
            }
        </script></code></pre>
        <pre class="cmake fragment"><code data-line-reveal="1-3|4"><script type="text/template">
            add_executable(my_exe main.cpp)
            target_link_libraries(my_exe k3::gdb)
            target_compile_options(my_exe PRIVATE -g)
            k3_gdb_discover_tests(my_exe [PRINTERS LinePrinter.py])
        </script></code></pre>
        <span><a>https://github.com/k3DW/gdb</a></span>
    </div>
</section>
