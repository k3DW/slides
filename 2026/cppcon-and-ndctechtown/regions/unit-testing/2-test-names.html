        <pre class="cpp fragment"><code data-line-reveal="1-8|9-13|1-17"><script type="text/template">
            NO_INLINE void test_start(const char* name) {
                _breakpoint_do_not_call_this_directly(name);
            }

            NO_INLINE void test_finish(const char* name) {
                _breakpoint_do_not_call_this_directly(name);
            }

            template <class T>
            NO_INLINE void assert_prints(const T& actual, const char* expected) {
                _breakpoint_do_not_call_this_directly(actual, expected);
            }

            template <class T>
            NO_INLINE void expect_prints(const T& actual, const char* expected) {
                _breakpoint_do_not_call_this_directly(actual, expected);
            }
        </script></code></pre>

</section>
