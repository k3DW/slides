<section my-columns="50%">
    <h2><code>children()</code> method</h2>
    <div style="width:100%;">
        <pre class="python"><code
            data-line-reveal="1-2,18|3-5|6-10|11-12|13|14|15-16|13-16|1-18"
        ><script type="text/template">
            def children(self):
                def generator():
                    left = self.val["left"]
                    right = self.val["right"]

                    steps = 5
                    step_size = (right - left) / (steps - 1)
                    current = left
                    index = 0

                    yield "steps", steps

                    while current <= right:
                        yield f"[{index}]", current
                        index += 1
                        current = left + index * step_size

                return generator()
        </script></code></pre>
    </div>
</section>
