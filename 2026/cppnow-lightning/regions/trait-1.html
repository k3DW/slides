<section my-columns>
    <h2>A trait to add two numbers</h2>
    <div style="width:100%;">
        <pre class="cpp"><code
            data-line-numbers=""
        ><script type="text/template">
            template <auto a, auto b>
            struct add {
                static constexpr auto value = a + b;
            };
        </script></code></pre>
        <pre class="cpp fragment"><code
            data-line-numbers=""
        ><script type="text/template">
            int main() {
                return add<2,3>::value;
            }
        </script></code></pre>

</section>
