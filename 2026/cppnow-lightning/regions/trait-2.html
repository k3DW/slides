<section data-markdown class="list-fade-in-then-semi-out">
    <textarea data-template>
        ## Let's interpret this differently
        * `add<foo()` - calling `operator<`
        * `3>::value` - calling `operator>`
        * `add<foo() , 3>::value` - calling `operator,`
        * Michael Caisse - "The evils of overloading operators"
    </textarea>
</section>

<section my-columns="90%">
    <h2>Making <code>add&lt;foo()</code> valid</h2>
    <div style="width:100%;">
        <pre class="cpp fragment"><code data-trim hide-line-numbers
            data-line-numbers=""
        ><script type="text/template">
             
            struct wrapper {
                int value;
            };
        </script></code></pre>
        <pre class="cpp fragment"><code data-trim hide-line-numbers
            data-line-numbers=""
        ><script type="text/template">
            struct add_t {};
            inline constexpr add_t add{};
        </script></code></pre>
        <pre class="cpp fragment"><code data-trim hide-line-numbers
            data-line-numbers=""
        ><script type="text/template">
             
            constexpr wrapper operator<(add_t, int value) {
                return { value };
            }
        </script></code></pre>
        <pre class="cpp fragment"><code data-trim hide-line-numbers
            data-line-numbers=""
        ><script type="text/template">
            add<foo()
        </script></code></pre>
    </div>
</section>

<section my-columns="90%">
    <h2>Making <code>add&lt;foo()</code> valid</h2>
    <div style="width:100%;">
        <pre class="cpp"><code data-trim hide-line-numbers
            data-line-numbers=""
        ><script type="text/template">
            template <class Tag>
            struct tagged_wrapper {
                int value;
            };
        </script></code></pre>
        <pre class="cpp"><code data-trim hide-line-numbers
            data-line-numbers=""
        ><script type="text/template">
            struct add_t {};
            inline constexpr add_t add{};
        </script></code></pre>
        <pre class="cpp"><code data-trim hide-line-numbers
            data-line-numbers=""
        ><script type="text/template">
            template <class Tag>
            constexpr tagged_wrapper<Tag> operator<(Tag, int value) {
                return { value };
            }
        </script></code></pre>
        <pre class="cpp"><code data-trim hide-line-numbers
            data-line-numbers=""
        ><script type="text/template">
            add<foo()
        </script></code></pre>
    </div>
</section>

<section my-columns="90%">
    <h2>Making <code>add&lt;foo()</code> valid</h2>
    <div style="width:100%;">
        <pre class="cpp"><code data-trim hide-line-numbers
            data-line-numbers=""
        ><script type="text/template">
            template <class Tag, class T>
            struct tagged_wrapper {
                T value;
            };
        </script></code></pre>
        <pre class="cpp"><code data-trim hide-line-numbers
            data-line-numbers=""
        ><script type="text/template">
            struct add_t {};
            inline constexpr add_t add{};
        </script></code></pre>
        <pre class="cpp"><code data-trim hide-line-numbers
            data-line-numbers=""
        ><script type="text/template">
            template <class Tag, class T>
            constexpr tagged_wrapper<Tag, std::remove_cvref_t<T>> operator<(Tag, T&& value) {
                return { std::forward<T>(value) };
            }
        </script></code></pre>
        <pre class="cpp"><code data-trim hide-line-numbers
            data-line-numbers=""
        ><script type="text/template">
            add<foo()
        </script></code></pre>
    </div>
</section>

<section my-columns="100%">
    <h2>Making <code>3>::value</code> valid</h2>
    <div style="width:100%;">
        <pre class="cpp fragment"><code data-trim hide-line-numbers
            data-line-numbers=""
        ><script type="text/template">
            struct value_t {};
            inline constexpr value_t value{};
        </script></code></pre>
        <pre class="cpp fragment"><code data-trim hide-line-numbers
            data-line-numbers=""
        ><script type="text/template">
            template <class T>
            constexpr tagged_wrapper<value_t, std::remove_cvref_t<T>> operator>(T&& value, value_t) {
                return { std::forward<T>(value) };
            }
        </script></code></pre>
        <pre class="cpp fragment"><code data-trim hide-line-numbers
            data-line-numbers=""
        ><script type="text/template">
            3>::value
        </script></code></pre>
    </div>
</section>

<section my-columns="100%">
    <h2>Making <code>add&lt;foo(),3&gt;::value</code> valid</h2>
    <div style="width:100%;">
        <pre class="cpp fragment"><code data-trim hide-line-numbers
            data-line-numbers=""
        ><script type="text/template">
            template <class T, class U>
            constexpr auto operator,(tagged_wrapper<add_t, T> lhs, tagged_wrapper<value_t, U> rhs) {
                return lhs.value + rhs.value;
            }
        </script></code></pre>
        <pre class="cpp fragment"><code data-trim hide-line-numbers
            data-line-numbers=""
        ><script type="text/template">
            int __attribute__((noinline)) foo() {
                return 2;
            }
            int main() {
                return add<foo(),3>::value
            }
        </script></code></pre>
    </div>
</section>
