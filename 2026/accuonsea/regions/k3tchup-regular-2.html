<section my-columns="50%">
    <h2>Reusability for compile-time</h2>
    <div style="width:100%;">
        <pre class="cpp"><code hide-line-numbers
            data-line-numbers
        ><script type="text/template">
            constexpr void check_optional(std::optional<int> o) {

                ASSERT(o.has_value());
                EXPECT(*o == 5);

            }
        </script></code></pre>
        <pre class="cpp fragment"><code hide-line-numbers
            data-line-numbers
        ><script type="text/template">
            TEST("my fixture", "my test") {
                check_optional(foo());
            }
        </script></code></pre>
        <div class="fragment" style="position:absolute; top:10%; left:27%; font-size:1000%;">
            ❌
        </div>
    </div>
</section>

<section my-columns="50%">
    <h2>Reusability for compile-time</h2>
    <div style="width:100%;">
        <pre class="cpp"><code hide-line-numbers
            data-line-numbers="1-7|4-5|"
            data-line-hide=   "4-5|   |"
        ><script type="text/template">
            template <std::invocable<> Fn>
            constexpr void check_optional(Fn fn) {

                ASSERT(fn().has_value());
                EXPECT(*fn() == 5);

            }
        </script></code></pre>
        <pre class="cpp fragment"><code hide-line-numbers
            data-line-numbers
        ><script type="text/template">
            #define CHECK_OPTIONAL(VALUE) \
                check_optional([]() { return VALUE; })
        </script></code></pre>
        <pre class="cpp fragment"><code hide-line-numbers
            data-line-numbers
        ><script type="text/template">
            TEST("my fixture", "my test") {
                CHECK_OPTIONAL(foo());
            }
        </script></code></pre>
        <div class="fragment" style="position:absolute; top:10%; left:27%; font-size:1000%;">
            ✔️
        </div>
    </div>
</section>
