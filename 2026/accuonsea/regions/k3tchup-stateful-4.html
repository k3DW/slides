<section my-columns>
    <h2>The "constexpr two-step"</h2>
    <div style="width:100%;">
        <pre class="cpp"><code hide-line-numbers
            data-line-numbers
        ><script type="text/template">
            constexpr std::string foo() {
                return "abcdefghijklmnopqrstuvwxyz";
            }
        </script></code></pre>
        <pre class="cpp fragment"><code hide-line-numbers
            data-line-numbers="1-6|2  |3  |4|5|2,4"
            data-line-hide=   "2-5|3-5|4-5|5| |"
        ><script type="text/template">
            constexpr auto two_step_foo() {
                constexpr std::size_t size = foo().size();
                std::array<char, size> arr{};
                std::ranges::copy(foo(), arr.begin());
                return arr;
            }
        </script></code></pre>
        <pre class="cpp fragment"><code hide-line-numbers
            data-line-numbers="2|3"
            data-line-hide=   "3| "
        ><script type="text/template">
            int main() {
                constexpr auto arr = two_step_foo();
                std::string str(arr.data(), arr.size());
            }
        </script></code></pre>
    </div>
</section>

<section data-markdown class="list-fade-in-then-semi-out">
    <textarea data-template>
        ## The "constexpr two-step"
        * Execute the constexpr function twice
        * Once to get the size
        * Once to get the data itself
    </textarea>
</section>

<section my-columns>
    <h2>The "three-step"?</h2>
    <div style="width:100%;">
        <pre class="cpp fragment"><code hide-line-numbers
            data-line-numbers="4-6     |3-7     |8-10     |2,11|1,12|"
            data-line-hide=   "1-3,7-12|1-2,8-12|1-2,11-12|1,12|    |"
        ><script type="text/template">
            const state ct_state = state_accessor::deserialize(
                [&]() consteval {
                    constexpr auto size = [&]() consteval {
                        state s = state_accessor::make();
                        (PACKET)(s);
                        return state_accessor::get_size(s);
                    }();
                    state s = state_accessor::make();
                    (PACKET)(s);
                    return state_accessor::serialize<size>(s);
                }()
            );
        </script></code></pre>
        <pre class="cpp fragment"><code hide-line-numbers
            data-line-numbers
        ><script type="text/template">
            state rt_state = state_accessor::make();
            (PACKET)(rt_state);
        </script></code></pre>
        <pre class="cpp fragment"><code hide-line-numbers
            data-line-numbers
        ><script type="text/template">
            state_accessor::report(ct_state, rt_state);
        </script></code></pre>
    </div>
</section>
