<section my-columns="80%">
    <h2>New overload of <code>ASSERT_THAT</code> and <code>EXPECT_THAT</code></h2>
    <div style="width:100%;">
        <pre class="cpp"><code
            data-line-numbers="4,10"
        ><script type="text/template">
            #define EXPECT_THAT(PACKET)                                   \
                {                                                         \
                    context::trace_context ctx;                           \
                    [&]<class T>(std::type_identity<T>) {                 \
                        if constexpr (std::invocable<T>) {                \
                            (PACKET)();                                   \
                        } else if constexpr (std::invocable<T, state&>) { \
                            /* do stuff */                                \
                        }                                                 \
                    }(std::type_identity<decltype(PACKET)>{});            \
                } static_assert(true, "require semicolon")
        </script></code></pre>
        <div class="fragment" style="position:absolute; top:10%; left:27%; font-size:1000%;">
            ✔️

    </div>
</section>
