<section data-markdown class="list-fade-in-then-semi-out">
    <textarea data-template>
        ## Detection idiom, type traits, concepts
        * Expect-success testing
        * Properties necessarily known at compile-time
        * No point in run-time checking
    </textarea>
</section>

<section my-columns>
    <h2>Detection idiom, type traits, concepts</h2>
    <div style="width:100%;">
        <pre class="cpp"><code data-line-numbers><script type="text/template">
            template <class T>
            struct wrapper {
                wrapper(T value) :
                    _value(std::move(value)) {}

                const T& operator()() const {
                    return _value;
                }

            private:
                T _value;
            };
        </script></code></pre>
        <pre class="cpp"><code
            data-line-numbers="1-6|5|"
            data-line-hide=   "5  | |"
        ><script type="text/template">
            #include "file.hpp"
            int main() {
                wrapper<int> w{42};
                static_assert(not is_assignable_v<decltype(w()), int>);
                assert(not is_assignable_v<decltype(w()), int>);
            }
        </script></code></pre>
    </div>
</section>

<section data-markdown class="list-fade-in-then-semi-out">
    <textarea data-template>
        ## `constexpr` code
        * User code executed at compile-time
        * ...therefore much more complexity
        * Possible that run-time code will differ
        * No UB in `constexpr` code allowed
    </textarea>
</section>
