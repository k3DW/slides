<section my-columns="45% 55%">
    <h2>Out-of-source compile-time testing</h2>
    <div style="width:100%;">
        <pre class="cpp"><code hide-line-numbers data-line-numbers="1-12|3-4|6-8|"><script type="text/template">
            template <class T>
            struct wrapper {
                wrapper(T value) :
                    _value(std::move(value)) {}

                const T& operator()() const {
                    return _value;
                }

            private:
                T _value;
            };
        </script></code></pre>
        <pre class="cpp fragment"><code hide-line-numbers data-line-numbers="|3|4|"><script type="text/template">
            #include "file.hpp"
            int main() {
                wrapper<int> w{42};
                w() = 67;
            }
        </script></code></pre>
    </div>
    <div style="width:100%;">
        <pre class="cmake fragment"><code hide-line-numbers
            data-line-numbers="1-3 |5-7 |9-14 |16-19|"
            data-line-hide=   "5-19|8-19|15-19|     |"
        ><script type="text/template">
            add_executable(compile_fail_test EXCLUDE_FROM_ALL
                file_test.cpp
            )

            target_include_directories(compile_fail_test
                PRIVATE .
            )

            add_test(
                NAME compile_fail_test
                COMMAND ${CMAKE_COMMAND}
                    --build ${CMAKE_BINARY_DIR}
                    --target compile_fail_test
            )

            set_tests_properties(compile_fail_test
                PROPERTIES
                    WILL_FAIL TRUE
            )
        </script></code></pre>
    </div>
</section>

<section data-markdown class="list-fade-in-then-semi-out">
    <textarea data-template>
        ## Out-of-source testing: pros
        * No extra language support needed
        * Test absolutely anything, no matter how complex
    </textarea>
</section>

<section data-markdown class="list-fade-in-then-semi-out">
    <textarea data-template>
        ## Out-of-source testing: cons
        * Only one granular check per file
        * Slower iteration time, must reconfigure for every new check
        * False positive, _fails for the wrong reason_
        * Doesn't tell you _why_ the failure occurred
    </textarea>
</section>

<section data-markdown class="list-fade-in-then-semi-out">
    <textarea data-template>
        ## In this case...
        * Checking correct file inclusion
        * Checking syntax in the whole file
        * Checking semantics of `wrapper<int> w{42};`
        * Checking semantics of `w() = 67;`
        * ...and this is a small file
    </textarea>
</section>
