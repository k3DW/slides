<section data-markdown class="list-fade-in-then-semi-out">
    <textarea data-template>
        ## `ASSERT_THAT` and `EXPECT_THAT`
        * Macros that take a "packet"
        * "Packets" must be callable with no arguments
        * Preserves the trace
    </textarea>
</section>

<section my-columns="100%">
    <h2><code>ASSERT_THAT</code> and <code>EXPECT_THAT</code></h2>
    <div style="width:100%;">
        <pre class="cpp"><code data-trim hide-line-numbers
            data-line-numbers="|6-8,18-19|"
        ><script type="text/template">
            template <class P,
                      std::invocable<> Input,
                      std::invocable<> Result,
                      std::invocable<> Remaining
            >
            auto check_parse_success_packet(P, Input, Result, Remaining)
            {
                return [] {
                    constexpr Input in;
                    constexpr Result res;
                    constexpr Remaining rem;
                    ASSERT_COMPILE_AND_RUN_TIME(P::parse(in()).has_value())
                      << std::format("P failed to parse {}", in());
                    EXPECT_COMPILE_AND_RUN_TIME(*P::parse(in()) == res())
                      << std::format("P::parse({}) was not {}", in(), res());
                    EXPECT_COMPILE_AND_RUN_TIME(P::parse(in()).remaining() == rem())
                      << std::format("P::parse({}) did not have {} remaining", in(), rem());
                };
            }
        </script></code></pre>
    </div>
</section>
