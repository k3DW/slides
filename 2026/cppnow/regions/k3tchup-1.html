<section data-markdown class="list-fade-in-then-semi-out">
    <textarea data-template>
        ## My unit testing library `k3tchup`
        * Prioritizes compile-time testing
        * Same test runner and scaffolding as before
        * Fewer macros, composable
        * Looks like GoogleTest
        * _Entirely rewritten assertion system_
        * All errors are reported at run-time
    </textarea>
</section>

<section my-columns="100%">
    <h2>Basic <code>k3tchup</code></h2>
    <div style="width:100%;">
        <pre class="cpp fragment"><code data-trim hide-line-numbers
            data-line-numbers="1-2 |4   |6-13|8    |10|11|"
            data-line-hide=   "4-13|6-13|8-11|10-11|11|  |"
        ><script type="text/template">
            #include <k3/k3tchup_main.hpp>
            #include <optional>

            FIXTURE("my fixture");

            TEST("my fixture", "my test") {

                constexpr std::optional<int> o = 4;

                ASSERT_COMPILE_TIME(o.has_value()) << "optional did not have a value";
                EXPECT_COMPILE_TIME(*o == 5) << "optional's value was not 5, it was " << *o;

            }
        </script></code></pre>
        <span><a>https://github.com/k3DW/k3tchup</a></span>
    </div>
</section>
