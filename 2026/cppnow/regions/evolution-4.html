<section my-columns>
    <h2>Abstracting the checks</h2>
    <div style="width:100%;">
        <pre class="cpp"><code hide-line-numbers data-line-numbers><script type="text/template">
            using Single = OneChar<'a'>;
            constexpr Single single;
        </script></code></pre>
        <pre class="cpp fragment"><code hide-line-numbers
            data-line-numbers="1-10|3  |4  |5  |6|7|"
            data-line-hide=   "3-7 |4-7|5-7|6-7|7| |"
        ><script type="text/template">
            void requirements_single()
            {
                assert
                    , is_parser<Single>
                    , parser_type_of<Single>.is_OneChar
                    , result_of<Single>.is<std::string_view>
                    ;
            }
        </script></code></pre>
    </div>
</section>

<section my-columns>
    <h2>Abstracting the checks</h2>
    <div style="width:100%;">
        <pre class="cpp fragment"><code hide-line-numbers
            data-line-numbers="1-9|3  |4  |5  |6  |7|8|"
            data-line-hide=   "3-8|4-8|5-8|6-8|7-8|8| |"
        ><script type="text/template">
            void parse_single()
            {
                assert
                    , parse<Single>("ab").success("a", "b")
                    , parse<Single>("abc").success("a", "bc")
                    , parse<Single>(" abc").failure(" abc")
                    , parse<Single>("ba").failure("ba")
                    ;
            }
        </script></code></pre>
    </div>
</section>

<section my-columns>
    <h2>Abstracting the checks</h2>
    <div style="width:100%;">
        <pre class="cpp fragment"><code hide-line-numbers
            data-line-numbers="1-10|3-8|5-6|7|"
            data-line-hide=   "3-8 |5-7|7  | |"
        ><script type="text/template">
            struct assert_t
            {
                friend consteval assert_t operator,(assert_t self, bool b)
                {
                    if (!b)
                        throw;
                    return self;
                }
            };
            inline constexpr assert_t assert;
        </script></code></pre>
    </div>
</section>
