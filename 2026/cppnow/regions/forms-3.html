<section data-markdown class="list-fade-in-then-semi-out">
    <textarea data-template>
        ## Detection idiom, type traits, concepts
        * Expect-success testing
        * Properties necessarily known at compile-time
        * No point in run-time checking
    </textarea>
</section>

<section my-columns>
    <h2>Detection idiom, type traits, concepts</h2>
    <div style="width:100%;">
        <pre class="cpp"><code data-line-numbers><script type="text/template">
            template <class T>
            struct wrapper {
                wrapper(T value) :
                    _value(std::move(value)) {}

                const T& operator()() const {
                    return _value;
                }

            private:
                T _value;
            };
        </script></code></pre>
        <pre class="cpp"><code
            data-line-numbers="1-6|5|"
            data-line-hide=   "5  | |"
        ><script type="text/template">
            #include "file.hpp"
            int main() {
                wrapper<int> w{42};
                static_assert(not is_assignable_v<decltype(w()), int>);
                assert(not is_assignable_v<decltype(w()), int>);
            }
        </script></code></pre>
    </div>
</section>

<section my-columns>
    <h2>Detection idiom, type traits, concepts</h2>
    <div style="width:100%;">
        <pre class="cpp"><code
            data-line-numbers="    |1-2 |4-9   |6     |7   |8 |11|"
            data-line-hide=   "1-11|4-11|6-8,11|7-8,11|8,11|11|  |"
        ><script type="text/template">
            template <class T>
            concept reference = std::is_reference_v<T>;

            template <class T, class U>
            concept call_assignable = requires (T t, U u) {
                t();
                { t() } -> reference;
                t() = u;
            };

            static_assert(call_assignable<wrapper<int>, int>);
        </script></code></pre>
        <pre class="text fragment"><code
            data-line-numbers="1-2|3|4-5"
        ><script type="text/template">
            path\to\file_test.cpp(11,15): error C2607: static assertion failed
                  path\to\file_test.cpp(11,15):
                  the concept 'call_assignable<wrapper<int>,int>' evaluated to false
                      path\to\file_test.cpp(8,18):
                      't': you cannot assign to a variable that is const
        </script></code></pre>
    </div>
</section>

<section my-columns>
    <h2>Detection idiom, type traits, concepts</h2>
    <div style="width:100%;">
        <pre class="cpp"><code
            data-line-numbers="|8"
        ><script type="text/template">
            template <class T>
            concept reference = std::is_reference_v<T>;

            template <class T, class U>
            concept call_assignable = requires (T t, U u) {
                t();
                { t() } -> reference;
                requires not requires { t() = u; };
            };

            static_assert(call_assignable<wrapper<int>, int>);
        </script></code></pre>
        <pre class="text"><code
            data-line-numbers=""
            data-line-hide=   "1-5"
        ><script type="text/template">
            path\to\file_test.cpp(11,15): error C2607: static assertion failed
                  path\to\file_test.cpp(11,15):
                  the concept 'call_assignable<wrapper<int>,int>' evaluated to false
                      path\to\file_test.cpp(8,18):
                      't': you cannot assign to a variable that is const
        </script></code></pre>
    </div>
</section>

<section my-columns="50% 50%">
    <h2><code>constexpr</code> code</h2>
    <div style="width:100%;">
        <pre class="cpp"><code
            data-line-numbers="   |1  |3  |5  |6|7|"
            data-line-hide=   "1-7|2-7|4-7|6-7|7| |"
        ><script type="text/template">
            constexpr auto abc = "abc"_all;

            constexpr auto result = abc.parse("abcd");

            static_assert(result.has_value());
            static_assert(result.value() == "abc");
            static_assert(result.remaining() == "d");
        </script></code></pre>
    </div>
