<section data-markdown class="list-fade-in-then-semi-out">
    <textarea data-template>
        ## Parser combinator library `tok3n`
        * C++20 library
        * Expression template parser generators
        * Started writing in 2021
        * How I learned almost all the metaprogramming I know
        * All types are empty types (for now)
        * Fully `constexpr` capable
        * All unit tests are compile-time tests
        * [https://github.com/k3DW/tok3n](https://github.com/k3DW/tok3n)
    </textarea>
</section>

<section my-columns>
    <h2>Basic <code>tok3n</code></h2>
    <div style="width:100%;">
        <pre class="cpp"><code data-trim hide-line-numbers data-line-numbers=""><script type="text/template">
            constexpr auto abc = "abc"_all;
        </script></code></pre>
        <pre class="cpp fragment"><code data-trim hide-line-numbers data-line-numbers=""><script type="text/template">
            constexpr auto result = abc.parse("abcd");
        </script></code></pre>
        <pre class="cpp fragment"><code data-trim hide-line-numbers
            data-line-numbers="1  |2|3|"
            data-line-hide=   "2-3|3| |"
        ><script type="text/template">
            static_assert(result.has_value());
            static_assert(result.value() == "abc");
            static_assert(result.remaining() == "d");
        </script></code></pre>
    </div>
</section>

<section my-columns>
    <h2><code>tok3n</code> combinators</h2>
    <div style="width:100%;">
        <pre class="cpp"><code data-trim hide-line-numbers
            data-line-numbers="1  |2|3|"
            data-line-hide=   "2-3|3| |"
        ><script type="text/template">
            constexpr auto abc = "abc"_all;
            constexpr auto xyz = "xyz"_any;
            constexpr auto p = ~abc >> !xyz >> (+xyz | *abc);
        </script></code></pre>
    </div>
</section>

<section my-columns>
    <h2><code>tok3n</code> "modifier" combinator</h2>
    <div style="width:100%;">
        <pre class="cpp fragment"><code data-trim hide-line-numbers data-line-numbers="2"><script type="text/template">
            constexpr auto abc = "abc"_all;
            constexpr auto p = complete(abc);
        </script></code></pre>
        <pre class="cpp fragment"><code data-trim hide-line-numbers data-line-numbers="2"><script type="text/template">
            constexpr auto abc = "abc"_all;
            constexpr auto p = abc % complete;
        </script></code></pre>
        <pre class="cpp fragment"><code data-trim hide-line-numbers
            data-line-numbers="1  |2|3|"
            data-line-hide=   "2-3|3| |"
        ><script type="text/template">
            constexpr auto result = p.parse("abcd");
            static_assert(not result.has_value());
            static_assert(result.remaining() == "abcd");
        </script></code></pre>
    </div>
</section>

<section my-columns>
    <h2><code>tok3n</code> parser functions</h2>
    <div style="width:100%;">
        <pre class="cpp"><code data-trim hide-line-numbers data-line-numbers=""><script type="text/template">
            constexpr auto abc = "abc"_all;
        </script></code></pre>
        <br/>
        <pre class="cpp fragment"><code data-trim hide-line-numbers data-line-numbers="1"><script type="text/template">
            constexpr auto result = abc.parse("abcd");
            static_assert(result.has_value());
            static_assert(result.value() == "abc");
            static_assert(result.remaining() == "d");
        </script></code></pre>
        <pre class="cpp fragment"><code data-trim hide-line-numbers data-line-numbers="2"><script type="text/template">
            std::string_view out;
            auto result = abc.parse("abcd", out);
            assert(result.has_value());
            assert(out == "abc");
            assert(result.remaining() == "d");
        </script></code></pre>
        <pre class="cpp fragment"><code data-trim hide-line-numbers data-line-numbers="1"><script type="text/template">
            constexpr auto result = abc.lookahead("abcd");
            static_assert(result.has_value());
            static_assert(result.remaining() == "d");
        </script></code></pre>
    </div>
</section>
