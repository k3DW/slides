        ## Writing a test framework
        * Each check happens at compile-time with `static_assert`

        * Highly specific assertion macros with custom error messages
    </textarea>

<section my-columns>
    <h2>Writing a test framework</h2>
    <div style="width:100%;">
        <pre class="cpp"><code data-trim hide-line-numbers data-line-numbers><script type="text/template">
            // #define DISABLE_STATIC_ASSERT

            #ifdef DISABLE_STATIC_ASSERT
            #define STATIC_ASSERT(...)
            #else
            #define STATIC_ASSERT(...) static_assert(__VA_ARGS__)
            #endif
        </script></code></pre>
        <pre class="cpp fragment"><code data-trim hide-line-numbers
            data-line-numbers="1-6|3  |4-5|"
            data-line-hide=   "3-5|4-5|   |"
        ><script type="text/template">
            #define ASSERT(CONDITION, MESSAGE)                        \
                {                                                     \
                    STATIC_ASSERT(CONDITION, MESSAGE);                \
                    if (!TestResultContext::check(CONDITION))         \
                        return TestResultContext::add_error(MESSAGE); \
                } static_assert(true, "require semicolon")
        </script></code></pre>

<section my-columns="90%">
    <h2>Writing a test framework</h2>
    <div style="width:100%;">
        <pre class="cpp"><code data-trim hide-line-numbers data-line-numbers><script type="text/template">
            #define ASSERT_CONCEPT(Concept, ...)               \
                ASSERT((Concept<__VA_ARGS__>),                 \
                    "`" STR(__VA_ARGS__) "` does not satisfy " \
                    "the " STR(Concept) " concept.")
        </script></code></pre>
        <pre class="cpp fragment"><code data-trim hide-line-numbers
            data-line-numbers="1  |2  |3-4|5-6|7-8|"
            data-line-hide=   "2-8|3-8|5-8|7-8|   |"
        ><script type="text/template">
            #define ASSERT_IS_PARSER(P, V, PARSER_FAMILY, ...)                          \
                ASSERT_CONCEPT(k3::tok3n::detail::parser, P);                           \
                ASSERT(P::family == PARSER_FAMILY,                                      \
                    "`" STR(P) "::family` does not equal " STR(PARSER_FAMILY));         \
                ASSERT((k3::tok3n::detail::parser_for<P, V>),                           \
                    "`parser_for<" STR(P) ", " STR(V) ">` is not satisfied");           \
                ASSERT((std::same_as<typename P::template result_for<V>, __VA_ARGS__>), \
                    "`" STR(P) "::result_for<" STR(V) ">` is not " STR(__VA_ARGS__))
        </script></code></pre>
    </div>
</section>

<section my-columns>
    <h2>Writing a test framework</h2>
    <div style="width:100%;">
        <pre class="cpp"><code data-trim hide-line-numbers
            data-line-numbers
        ><script type="text/template">
            #define ASSERT_PARSE_SUCCESS(P, INPUT, OUTPUT, REMAINING)       \
                ASSERT_CONCEPT(k3::tok3n::detail::parser, P);               \
                ASSERT_PARSE_IMPL_PARSE_VALID_(P, INPUT);                   \
                ASSERT_PARSE_IMPL_PARSE_RESULT_(P, INPUT, OUTPUT);          \
                ASSERT_PARSE_IMPL_PARSE_REMAINING_(P, INPUT, REMAINING);    \
                ASSERT_PARSE_IMPL_LOOKAHEAD_VALID_(P, INPUT);               \

<section data-markdown class="list-fade-in-then-semi-out">
    <textarea data-template>
        ## Writing a test framework: pros
        * Custom `static_assert` messages pre C++26
        * Run-time test runner to report issues more nicely
        * CMake integration
    </textarea>
</section>

<section data-markdown class="list-fade-in-then-semi-out">
    <textarea data-template>
        ## Writing a test framework: cons
        * Global control of run-time vs compile-time
        * All messages are macro-based
        * Framework is tightly coupled to `tok3n`
        * Dependency on Boost.Preprocessor
        * _Suboptimal handling of dependent checks_
    </textarea>
</section>
